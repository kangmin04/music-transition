<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    --page-plane:      #f9f9f7;

    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-serious:  #ec835a;
    --status-critical: #d03b3b;
    --status-good-track:     rgba(12,163,12,0.13);
    --status-warning-track:  rgba(250,178,25,0.20);
    --status-critical-track: rgba(208,59,59,0.13);
    --font-sans: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:      #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --status-good:     #0ca30c;
      --status-warning:  #fab219;
      --status-serious:  #ec835a;
      --status-critical: #e66767;
      --status-good-track:     rgba(12,163,12,0.18);
      --status-warning-track:  rgba(250,178,25,0.16);
      --status-critical-track: rgba(230,103,103,0.18);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:      #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-serious:  #ec835a;
    --status-critical: #e66767;
    --status-good-track:     rgba(12,163,12,0.18);
    --status-warning-track:  rgba(250,178,25,0.16);
    --status-critical-track: rgba(230,103,103,0.18);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: var(--font-sans);
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  body {
    padding: 32px 16px 64px;
  }
  main {
    max-width: 920px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .kicker {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
  }
  header h1 {
    font-size: 22px;
    margin: 4px 0 2px;
    font-weight: 700;
  }
  header .meta-line {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
  }

  /* ---- Hero ---- */
  .hero {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 22px;
  }
  .hero-figure {
    font-size: 56px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .hero-figure .max {
    font-size: 22px;
    font-weight: 500;
    color: var(--text-muted);
  }
  .hero-mid { display: flex; flex-direction: column; gap: 8px; }
  .hero-label { font-size: 13px; color: var(--text-secondary); }
  .hero-meter-track {
    width: 100%;
    height: 10px;
    border-radius: 5px;
    background: var(--gridline);
    overflow: hidden;
  }
  .hero-meter-fill {
    height: 100%;
    border-radius: 5px;
  }
  .hero-delta { font-size: 12px; }
  .hero-delta.up { color: var(--status-good); }
  .hero-delta.down { color: var(--status-critical); }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .chip.good     { background: var(--status-good-track);     color: var(--status-good); }
  .chip.warning  { background: var(--status-warning-track);  color: var(--text-primary); }
  .chip.critical { background: var(--status-critical-track); color: var(--status-critical); }
  .chip.good .dot     { background: var(--status-good); }
  .chip.warning .dot  { background: var(--status-warning); }
  .chip.critical .dot { background: var(--status-critical); }
  .tier-sub { font-size: 12px; color: var(--text-secondary); margin-top: 6px; max-width: 280px; text-align: right; }

  /* ---- Category meters ---- */
  .section-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin: 4px 2px 0;
  }
  .cat-list { display: flex; flex-direction: column; }
  .cat-row {
    display: grid;
    grid-template-columns: 34px 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-top: 1px solid var(--gridline);
  }
  .cat-row:first-of-type { border-top: none; }
  .cat-code {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: var(--page-plane);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: var(--text-secondary);
  }
  .cat-main { min-width: 0; }
  .cat-name-line {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    font-size: 14px; font-weight: 600; margin-bottom: 6px;
  }
  .cat-name-line .pts { font-size: 12px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cat-track {
    width: 100%; height: 8px; border-radius: 4px; background: var(--gridline); overflow: hidden;
  }
  .cat-fill { height: 100%; border-radius: 4px; }
  .cat-status {
    display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .cat-status .glyph { font-size: 11px; }
  .cat-status.good { color: var(--status-good); }
  .cat-status.warning { color: #a06b00; }
  .cat-status.critical { color: var(--status-critical); }
  :root[data-theme="dark"] .cat-status.warning,
  :root:not([data-theme="light"]) .cat-status.warning { color: var(--status-warning); }

  .cat-details {
    grid-column: 1 / -1;
    margin-top: 10px;
    padding-left: 48px;
  }
  .cat-details summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
  }
  .criterion {
    margin-top: 10px;
    font-size: 13px;
    line-height: 1.5;
  }
  .criterion .c-head {
    display: flex; justify-content: space-between; gap: 10px;
    font-weight: 600; color: var(--text-primary);
  }
  .criterion .c-pts { color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .criterion .c-evidence { color: var(--text-secondary); margin-top: 2px; }
  .criterion .c-gap { color: var(--status-serious); margin-top: 2px; }
  .criterion .c-confidence { color: var(--text-muted); font-size: 11px; margin-top: 2px; }

  /* ---- ROI action table ---- */
  .table-scroll { overflow-x: auto; }
  table.actions {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 640px;
  }
  table.actions th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    font-weight: 700;
    padding: 0 10px 8px;
    border-bottom: 1px solid var(--gridline);
  }
  table.actions td {
    padding: 10px 10px;
    border-bottom: 1px solid var(--gridline);
    vertical-align: top;
  }
  table.actions tr:last-child td { border-bottom: none; }
  table.actions td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rank-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 5px;
    background: var(--page-plane); border: 1px solid var(--border);
    font-size: 11px; font-weight: 700; color: var(--text-secondary);
  }
  .cat-tag {
    display: inline-block;
    font-size: 11px; font-weight: 700;
    color: var(--text-secondary);
    background: var(--page-plane);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 6px;
  }
  .action-rationale { color: var(--text-muted); font-size: 12px; margin-top: 3px; }
  .effort-tag { font-size: 11px; color: var(--text-muted); }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    padding-top: 8px;
  }

  @media (max-width: 560px) {
    .hero { grid-template-columns: 1fr; text-align: left; }
    .tier-sub { text-align: left; max-width: none; }
    .cat-row { grid-template-columns: 30px 1fr; }
    .cat-status { grid-column: 2; margin-top: 6px; }
  }
</style>
</head>

<script>
(function () {
  var DATA = JSON.parse(document.getElementById('cartography-data').textContent);

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function statusColorVar(status) {
    if (status === 'good') return 'var(--status-good)';
    if (status === 'warning') return 'var(--status-warning)';
    return 'var(--status-critical)';
  }
  function statusGlyph(status) {
    if (status === 'good') return '●';
    if (status === 'warning') return '▲';
    return '■';
  }
  function statusLabel(status) {
    if (status === 'good') return '양호';
    if (status === 'warning') return '주의';
    return '위험';
  }

  // Header
  document.title = 'AI-Readiness Cartography · ' + (DATA.meta.repoName || '');
  document.getElementById('repo-title').textContent = (DATA.meta.repoName || '레포') + ' — AI-Readiness 감사';
  var metaParts = [];
  if (DATA.meta.auditedAt) metaParts.push('감사일 ' + DATA.meta.auditedAt.slice(0, 10));
  if (DATA.meta.commit) metaParts.push('commit ' + DATA.meta.commit.slice(0, 7));
  metaParts.push('루브릭 ' + DATA.meta.rubricVersion);
  document.getElementById('meta-line').textContent = metaParts.join(' · ');

  // Hero
  document.getElementById('hero-score').textContent = DATA.totalScore;
  document.getElementById('hero-max').textContent = DATA.maxScore;
  var heroPct = Math.max(0, Math.min(100, (DATA.totalScore / DATA.maxScore) * 100));
  var heroFill = document.getElementById('hero-meter-fill');
  heroFill.style.width = heroPct + '%';
  heroFill.style.background = statusColorVar(DATA.tier.status);

  if (typeof DATA.delta === 'number') {
    var d = document.getElementById('hero-delta');
    var sign = DATA.delta > 0 ? '+' : '';
    d.textContent = sign + DATA.delta + '점 (직전 감사 대비)';
    d.className = 'hero-delta ' + (DATA.delta > 0 ? 'up' : (DATA.delta < 0 ? 'down' : ''));
  }

  var chip = document.getElementById('tier-chip');
  chip.classList.add(DATA.tier.status);
  document.getElementById('tier-chip-text').textContent = DATA.tier.chip;
  document.getElementById('tier-label').textContent = DATA.tier.label;

  // Categories
  var catList = document.getElementById('cat-list');
  (DATA.categories || []).forEach(function (cat) {
    var row = el('div', 'cat-row');
    row.appendChild(el('div', 'cat-code', cat.code));

    var main = el('div', 'cat-main');
    var nameLine = el('div', 'cat-name-line');
    nameLine.appendChild(el('span', null, cat.name));
    nameLine.appendChild(el('span', 'pts', cat.earnedPoints + ' / ' + cat.maxPoints));
    main.appendChild(nameLine);

    var track = el('div', 'cat-track');
    var fill = el('div', 'cat-fill');
    var pct = Math.max(0, Math.min(100, (cat.earnedPoints / cat.maxPoints) * 100));
    fill.style.width = pct + '%';
    fill.style.background = statusColorVar(cat.status);
    track.appendChild(fill);
    main.appendChild(track);
    row.appendChild(main);

    var statusEl = el('div', 'cat-status ' + cat.status);
    statusEl.appendChild(el('span', 'glyph', statusGlyph(cat.status)));
    statusEl.appendChild(document.createTextNode(statusLabel(cat.status)));
    row.appendChild(statusEl);

    if (cat.criteria && cat.criteria.length) {
      var details = el('details', 'cat-details');
      var summary = el('summary', null, '근거 ' + cat.criteria.length + '개 보기');
      details.appendChild(summary);
      cat.criteria.forEach(function (c) {
        var block = el('div', 'criterion');
        var head = el('div', 'c-head');
        head.appendChild(el('span', null, c.id + ' · ' + c.description));
        head.appendChild(el('span', 'c-pts', c.earnedPoints + '/' + c.maxPoints));
        block.appendChild(head);
        if (c.evidence) block.appendChild(el('div', 'c-evidence', '근거: ' + c.evidence));
        if (c.gap) block.appendChild(el('div', 'c-gap', '갭: ' + c.gap));
        if (c.confidence) block.appendChild(el('div', 'c-confidence', '신뢰도: ' + c.confidence));
        details.appendChild(block);
      });
      row.appendChild(details);
    }

    catList.appendChild(row);
  });

  // Action list
  var body = document.getElementById('actions-body');
  (DATA.actionList || []).forEach(function (a) {
    var tr = document.createElement('tr');

    var tdRank = el('td', 'num');
    tdRank.appendChild(el('span', 'rank-badge', a.rank));
    tr.appendChild(tdRank);

    var tdCat = document.createElement('td');
    tdCat.appendChild(el('span', 'cat-tag', a.category));
    tr.appendChild(tdCat);

    var tdAction = document.createElement('td');
    tdAction.appendChild(el('div', null, a.action));
    if (a.rationale) tdAction.appendChild(el('div', 'action-rationale', a.rationale));
    tr.appendChild(tdAction);

    tr.appendChild(el('td', 'num', '+' + a.impact));
    var tdEffort = el('td', 'num');
    tdEffort.appendChild(el('span', 'effort-tag', a.effort));
    tr.appendChild(tdEffort);
    tr.appendChild(el('td', 'num', a.roi));

    body.appendChild(tr);
  });

  document.getElementById('footer-line').textContent =
    'Generated by the cartography skill · ' + DATA.meta.rubricVersion + ' · ' + (DATA.meta.auditor || 'Claude Code');
})();
</script>
